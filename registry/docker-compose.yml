# Local Docker registry for OTA demos (insecure HTTP on :5000).
# Docker Desktop → Settings → Docker Engine, add:
#   "insecure-registries": ["localhost:5000"]
# then Apply & Restart.
services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    restart: unless-stopped

volumes:
  registry_data:
