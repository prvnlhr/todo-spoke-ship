# Hub deployment — same app image as spoke, APP_ROLE=hub
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: todo-app:1.1
    pull_policy: build
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      APP_NAME: "Todo Hub"
      APP_ROLE: hub
      DB_DATABASE: todo_hub
      DB_USERNAME: hub
      DB_PASSWORD: secret
      SEED_ON_BOOT: "true"
    volumes:
      - ../app:/var/www/html
      - ./.env:/var/www/html/.env:ro
      - hub_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hub

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todo_hub
      MYSQL_USER: hub
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - hub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - hub

volumes:
  hub_mysql_data:
  hub_vendor:

networks:
  hub:
    driver: bridge
