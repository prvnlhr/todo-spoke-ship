# Hub from registry image (no source bind-mount). Watchtower pulls new tags.
# Usage: docker compose -f docker-compose.ota.yml up -d
# Requires: local registry + image pushed (push-ota.bat)
services:
  app:
    image: ${APP_IMAGE:-localhost:5000/todo-app:latest}
    pull_policy: always
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      APP_NAME: "Todo Hub"
      APP_ROLE: hub
      DB_DATABASE: todo_hub
      DB_USERNAME: hub
      DB_PASSWORD: secret
      SEED_ON_BOOT: "true"
    volumes:
      - ./.env:/var/www/html/.env:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hub

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todo_hub
      MYSQL_USER: hub
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - hub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - hub

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    restart: unless-stopped
    networks:
      - hub

volumes:
  hub_mysql_data:

networks:
  hub:
    driver: bridge
