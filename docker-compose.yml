services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-app:1.0
    pull_policy: build
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      APP_NAME: Todo
      APP_ROLE: spoke
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-todo}
      MYSQL_USER: ${DB_USERNAME:-todo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo

volumes:
  mysql_data:
  app_storage:

networks:
  todo:
    driver: bridge
